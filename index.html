<!DOCTYPE html>
<html>
<head>
    <title>RNG Number</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 8px;
            font-family: "Times New Roman", Times, serif;
            color: black;
            background: white;
            text-align: center;
        }

        .machine {
            width: 100%;
            max-width: 650px;
            margin: 40px auto;
        }

        h1 {
            font-size: 32px;
        }

        .subtitle {
            font-size: 16px;
        }

        .display {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin: 25px 0;
        }

        .digit {
            width: 9%;
            padding: 8px 0;
            border: 1px solid black;
            font-size: 32px;
            font-weight: bold;
        }

        button {
            padding: 8px 20px;
            font-family: "Times New Roman", Times, serif;
            font-size: 18px;
            color: black;
            background: white;
            border: 1px solid black;
            cursor: pointer;
        }

        button:disabled {
            cursor: default;
        }

        #status {
            margin-top: 20px;
            min-height: 20px;
        }

        .result-label {
            margin-top: 25px;
        }

        .result {
            margin-top: 8px;
            font-size: 28px;
            overflow-wrap: anywhere;
        }

        .range {
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="machine">
    <h1>RNG machine</h1>
    <div class="subtitle">
        SPIN NUMBERS, EARN POINTS
    </div>

    <div class="display" id="display"></div>

    <button id="spinButton" onclick="generateNumber()">
        SPIN!
    </button>

    <div id="status">READY TO ROLL?</div>

    <div class="result-label">YOUR NUMBER</div>
    <div class="result" id="result">??????????</div>

    <div class="range">
        MIN: 0 | MAX: 9,999,999,999
    </div>
</div>

<script>
    const min = 0;
    const max = 9999999999;
    const digits = 10;

    const display = document.getElementById("display");
    const result = document.getElementById("result");
    const status = document.getElementById("status");
    const button = document.getElementById("spinButton");

    // Create the digit reels
    for (let i = 0; i < digits; i++) {
        const digit = document.createElement("div");
        digit.className = "digit";
        digit.textContent = "0";
        display.appendChild(digit);
    }

    const reels = document.querySelectorAll(".digit");

    function generateNumber() {
        if (button.disabled) return;

        button.disabled = true;
        result.textContent = "SPINNING...";
        status.textContent = "GOOOOOOOOOO";
        button.textContent = "SPINNING...";

        const finalNumber =
            Math.floor(Math.random() * (max - min + 1)) + min;

        const finalDigits =
            String(finalNumber).padStart(digits, "0");

        const startTime = performance.now();
        const duration = 7500;

        const stopTimes = Array.from(
            { length: digits },
            (_, i) => 1000 + i * 650
        );

        function animate(now) {
            const elapsed = now - startTime;

            reels.forEach((reel, i) => {
                if (elapsed < stopTimes[i]) {
                    reel.textContent = Math.floor(
                        Math.random() * 10
                    );
                } else {
                    reel.textContent = finalDigits[i];
                }
            });

            if (elapsed < duration) {
                requestAnimationFrame(animate);
            } else {
                reels.forEach((reel, i) => {
                    reel.textContent = finalDigits[i];
                });

                result.textContent =
                    finalNumber.toLocaleString("en-US");

                status.textContent = "DONE!";
                button.textContent = "SPIN!";
                button.disabled = false;
            }
        }

        requestAnimationFrame(animate);
    }
</script>

</body>
</html>
