<div class="machine">
    <h1>RNG but uwu ig idk</h1>
    <div class="subtitle">PULL THE LEVER • SPIN THE NUMBERS</div>

    <div class="lever" id="lever">🕹️</div>

    <div class="display" id="display"></div>

    <button id="spinButton" onclick="generateNumber()">
        ⚡ SPIN!
    </button>

    <div id="status">READY TO ROLL?</div>

    <div class="result-label">YOUR NUMBER</div>
    <div class="result" id="result">??????????</div>

    <div class="range">
        MIN: 0 &nbsp; | &nbsp; MAX: 1,000,000,000
    </div>
</div>

<script>
    const min = 0;
    const max = 1000000000;
    const digits = 10;

    const display = document.getElementById("display");
    const result = document.getElementById("result");
    const status = document.getElementById("status");
    const button = document.getElementById("spinButton");
    const lever = document.getElementById("lever");

    // Create the digit reels
    for (let i = 0; i < digits; i++) {
        const digit = document.createElement("div");
        digit.className = "digit";
        digit.textContent = "0";
        display.appendChild(digit);
    }

    const reels = document.querySelectorAll(".digit");

    function generateNumber() {
        if (button.disabled) return;

        button.disabled = true;
        result.classList.remove("win");
        result.textContent = "SPINNING...";
        status.textContent = "GOOD LUCK...";
        button.textContent = "🎰 SPINNING";

        lever.classList.remove("pull");
        void lever.offsetWidth;
        lever.classList.add("pull");

        const finalNumber = Math.floor(
            Math.random() * (max - min + 1)
        ) + min;

        const finalDigits = String(finalNumber).padStart(digits, "0");
        const startTime = performance.now();
        const duration = 3000;

        // Each reel stops at a slightly different time
        const stopTimes = Array.from(
            { length: digits },
            (_, i) => 1300 + i * 180
        );

        function animate(now) {
            const elapsed = now - startTime;

            reels.forEach((reel, i) => {
                if (elapsed < stopTimes[i]) {
                    reel.classList.add("spinning");
                    reel.textContent = Math.floor(
                        Math.random() * 10
                    );
                } else {
                    reel.classList.remove("spinning");
                    reel.textContent = finalDigits[i];
                }
            });

            if (elapsed < duration) {
                requestAnimationFrame(animate);
            } else {
                reels.forEach((reel, i) => {
                    reel.classList.remove("spinning");
                    reel.textContent = finalDigits[i];
                });

                result.textContent = finalNumber.toLocaleString("en-US");
                button.disabled = false;
            }
        }

        requestAnimationFrame(animate);
    }
</script>
